name: Build Cassette Motion Pro

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  VERSION: 0.12.3

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Windows bundle folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows
          @(
            "Installer build status: NOT STARTED"
            "Version: $env:VERSION"
            ""
            "The workflow stopped before portable or installer artifacts were created."
            "Open the GitHub Actions build log and check the first failed step above Upload Windows bundle."
          ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"

      - name: Restore upstream native dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Kinovea/Kinovea.git "$env:RUNNER_TEMP\kinovea-upstream"
          if (Test-Path "src\Refs" -PathType Leaf) {
            Remove-Item "src\Refs" -Force
          }
          New-Item -ItemType Directory -Force "src\Refs"
          Copy-Item "$env:RUNNER_TEMP\kinovea-upstream\Refs\*" "src\Refs\" -Recurse -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore src/CassetteMotionPro.sln

      - name: Build solution
        run: msbuild src/CassetteMotionPro.sln /p:Platform="x64" /p:Configuration=Release /p:AllowedReferenceRelatedFileExtensions=none

      - name: Create portable settings folder
        shell: cmd
        run: mkdir src\Kinovea\bin\x64\Release\AppData

      - name: Create portable zip for Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows
          Compress-Archive -Path "src\Kinovea\bin\x64\Release\*" -DestinationPath "dist\windows\CassetteMotionPro-Portable-$env:VERSION.zip" -Force
          @(
            "Installer build status: NOT RUN"
            "Version: $env:VERSION"
            ""
            "The portable zip was created."
            "If this file was not replaced with SUCCESS or FAILED, the workflow stopped before the Build installer step."
            "Open the GitHub Actions build log and check Install NSIS and Build installer."
          ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"
          Get-ChildItem dist\windows

      - name: Upload portable application
        uses: actions/upload-artifact@v6
        with:
          name: CassetteMotionPro-Portable-${{ env.VERSION }}
          path: src/Kinovea/bin/x64/Release/

      - name: Remove portable settings folder
        shell: cmd
        run: rmdir src\Kinovea\bin\x64\Release\AppData

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path $nsisPath)) {
            $nsisPath = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          }
          if (!(Test-Path $nsisPath)) {
            throw "makensis.exe was not found after installing NSIS."
          }
          "MAKENSIS_PATH=$nsisPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $nsisPath /VERSION

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\installer
          New-Item -ItemType Directory -Force dist\windows
          try {
            if ([string]::IsNullOrWhiteSpace($env:MAKENSIS_PATH) -or !(Test-Path $env:MAKENSIS_PATH)) {
              throw "MAKENSIS_PATH is missing or invalid: $env:MAKENSIS_PATH"
            }

            Push-Location src\Installer
            Write-Host "Installer source files:"
            Get-ChildItem -Force | Select-Object Name, Length
            & $env:MAKENSIS_PATH /DVERSION=$env:VERSION kinovea.nsi
            $makensisExitCode = $LASTEXITCODE
            Pop-Location

            if ($makensisExitCode -ne 0) {
              throw "makensis exited with code $makensisExitCode."
            }

            $installer = Get-ChildItem -Path . -Filter "CassetteMotionPro-$env:VERSION.exe" -File -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $installer) {
              $installer = Get-ChildItem -Path . -Filter "CassetteMotionPro-*.exe" -File -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            }

            if (-not $installer) {
              Write-Host "No installer found. Listing EXE files for debugging:"
              Get-ChildItem -Path . -Filter "*.exe" -Recurse | Select-Object FullName
              throw "Installer exe was not created."
            }

            Copy-Item $installer.FullName "dist\installer\CassetteMotionPro-Installer-$env:VERSION.exe" -Force
            Copy-Item $installer.FullName "dist\windows\CassetteMotionPro-Installer-$env:VERSION.exe" -Force
            @(
              "Installer build status: SUCCESS"
              "Version: $env:VERSION"
              "NSIS: $env:MAKENSIS_PATH"
              "Installer source: $($installer.FullName)"
              "Installer artifact: CassetteMotionPro-Installer-$env:VERSION.exe"
              "Windows bundle: CassetteMotionPro-Windows-$env:VERSION"
            ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"
            Get-ChildItem dist\installer
            Get-ChildItem dist\windows
          }
          catch {
            if ((Get-Location).Path -like "*\src\Installer") {
              Pop-Location
            }

            @(
              "Installer build status: FAILED"
              "Version: $env:VERSION"
              "NSIS: $env:MAKENSIS_PATH"
              "Error: $($_.Exception.Message)"
              ""
              "The portable zip should still be in this Windows bundle."
              "Open the GitHub Actions build log and search for: Build installer"
            ) | Set-Content "dist\windows\INSTALLER-BUILD-STATUS.txt"
            Write-Host "Installer build failed. EXE files found during diagnostics:"
            Get-ChildItem -Path . -Filter "*.exe" -Recurse | Select-Object FullName
            throw
          }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: CassetteMotionPro-Installer-${{ env.VERSION }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Upload Windows bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: CassetteMotionPro-Windows-${{ env.VERSION }}
          path: dist/windows/*
          if-no-files-found: error
